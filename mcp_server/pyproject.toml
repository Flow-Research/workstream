[project]
name = "workstream-mcp-server"
version = "0.1.0"
description = "Contributor-facing Workstream MCP server"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
  "mcp>=1.27,<2.0",
  "pydantic>=2.6,<3.0",
]

[project.scripts]
workstream-mcp-server = "workstream_mcp.server:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["workstream_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
