[tool.hatch.build.targets.sdist]
include = [
  "/contracts/*.json",
  "/workstream_mcp",
  "/pyproject.toml",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# Fixture bearer strings exercise redaction and request isolation; they are not credentials.
"tests/**/*.py" = ["S101", "S106", "S107"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["workstream_mcp"]
