[project]
name = "workstream-backend"
version = "0.1.0"
description = "Workstream backend API"
requires-python = ">=3.11,<3.13"
dependencies = [
  "aiobotocore==3.7.0",
  "alembic>=1.13,<2.0",
  "asyncpg>=0.29,<1.0",
  "botocore==1.43.0",
  "celery[redis]>=5.4,<6.0",
  "defusedxml @ https://files.pythonhosted.org/packages/07/6c/aa3f2f849e01cb6a001cd8554a88d4c77c5c1a31c95bdf1cf9301e6d9ef4/defusedxml-0.7.1-py2.py3-none-any.whl#sha256=a352e7e428770286cc899e2542b6cdaedb2b4953ff269a210103ec58f6198a61",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "Pillow @ https://files.pythonhosted.org/packages/c8/98/766667a4be768150a202836acd9fad19c06824ca86c4286d3cf6b274964e/pillow-12.3.0-cp311-cp311-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl#sha256=bcb46e2f9feff8d06323983bd83ed00c201fdcab3d74973e7072a889b3979fcd ; python_version == \"3.11\" and sys_platform == \"linux\" and platform_machine == \"aarch64\" and platform_python_implementation == \"CPython\"",
  "Pillow @ https://files.pythonhosted.org/packages/3b/2d/ede717bc1144f63886c21fd349bb95860b0d1a21149ff16f2bb362b612b6/pillow-12.3.0-cp311-cp311-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl#sha256=23d27a3e0307ec2244cc51e7287b919aa68d097504ebe19df4e76a98a3eea5bd ; python_version == \"3.11\" and sys_platform == \"linux\" and platform_machine == \"x86_64\" and platform_python_implementation == \"CPython\"",
  "Pillow @ https://files.pythonhosted.org/packages/25/27/ac8f99618ffd3dde21db0f4d4b1d2ab00c0880595bfd17df103f7f39fd0c/pillow-12.3.0-cp312-cp312-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl#sha256=d9c7f76c0673154f044e9d78c8655fb4213f6ca31a836df48b40fe5d187717b9 ; python_version == \"3.12\" and sys_platform == \"linux\" and platform_machine == \"aarch64\" and platform_python_implementation == \"CPython\"",
  "Pillow @ https://files.pythonhosted.org/packages/84/21/a35af28dcc61f37ed850a2d64c65c701321dfbf25085e469d5559360cbbf/pillow-12.3.0-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl#sha256=78cb2c6865a35ab8ff8b75fd122f6033b92a62c82801110e48ddd6c936a45d91 ; python_version == \"3.12\" and sys_platform == \"linux\" and platform_machine == \"x86_64\" and platform_python_implementation == \"CPython\"",
  "PyJWT[crypto]>=2.13,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "pypdf @ https://files.pythonhosted.org/packages/49/e6/136aa8993a2ae7214e0b0ef2edaa0d2e08d1d4e4982635b08a835ff31ec8/pypdf-6.14.2-py3-none-any.whl#sha256=3f07891af76dc002657e04993ab9b4de81de29f9013b9761d0b7968bff12e946",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "migration_contracts*"]

[project.optional-dependencies]
agents = [
  "openai-agents>=0.17,<1.0",
]

dev = [
  "docstr-coverage>=2.3,<3.0",
  "jsonschema==4.26.0",
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov==7.1.0",
  "ruff>=0.8,<0.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "postgres_schema_contract: test owns whole-schema Alembic transitions and requires a rebuilt PostgreSQL baseline",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv]
environments = [
  "sys_platform == 'linux' and platform_machine == 'aarch64' and platform_python_implementation == 'CPython'",
  "sys_platform == 'linux' and platform_machine == 'x86_64' and platform_python_implementation == 'CPython'",
]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'aarch64' and platform_python_implementation == 'CPython'",
  "sys_platform == 'linux' and platform_machine == 'x86_64' and platform_python_implementation == 'CPython'",
]
