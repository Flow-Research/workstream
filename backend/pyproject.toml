[project]
name = "workstream-backend"
version = "0.1.0"
description = "Workstream backend API"
requires-python = ">=3.11,<3.13"
dependencies = [
  "aiobotocore==3.7.0",
  "alembic>=1.13,<2.0",
  "asyncpg>=0.29,<1.0",
  "botocore==1.43.0",
  "celery[redis]>=5.4,<6.0",
  "defusedxml @ https://files.pythonhosted.org/packages/07/6c/aa3f2f849e01cb6a001cd8554a88d4c77c5c1a31c95bdf1cf9301e6d9ef4/defusedxml-0.7.1-py2.py3-none-any.whl#sha256=a352e7e428770286cc899e2542b6cdaedb2b4953ff269a210103ec58f6198a61",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "PyJWT[crypto]>=2.13,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
agents = [
  "openai-agents==0.22.2",
  "openai==3.11.0",
  "httpx2==2.12.0",
]

dev = [
  "docstr-coverage>=2.3,<3.0",
  "jsonschema==4.26.0",
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.4,<2.0",
  "pytest-cov==7.1.0",
  "ruff>=0.8,<0.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "postgres_schema_contract: test owns whole-schema Alembic transitions and requires a rebuilt PostgreSQL baseline",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv]
environments = [
  "sys_platform == 'linux' and platform_machine == 'aarch64' and platform_python_implementation == 'CPython'",
  "sys_platform == 'linux' and platform_machine == 'x86_64' and platform_python_implementation == 'CPython'",
]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'aarch64' and platform_python_implementation == 'CPython'",
  "sys_platform == 'linux' and platform_machine == 'x86_64' and platform_python_implementation == 'CPython'",
]
