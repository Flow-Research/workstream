[package]
name = "workstream-checker-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
trial-docker-qualification = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
libc.workspace = true
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
workstream-checker-sdk = { path = "../workstream-checker-sdk" }
workstream-checker-guest = { path = "../workstream-checker-guest" }

[[bin]]
name = "qualify-trial-docker"
path = "src/bin/qualify_trial_docker.rs"
test = false
bench = false
required-features = ["trial-docker-qualification"]
