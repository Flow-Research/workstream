[workspace]
members = ["workstream-checker-sdk", "workstream-checker-service"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.84"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.138", features = ["arbitrary_precision"] }
sha2 = "0.10.8"
libc = "0.2.190"
