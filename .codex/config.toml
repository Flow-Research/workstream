# Project-local Codex configuration for Workstream's Commitrail method.
#
# This file is intentionally small. Codex only loads project-local `.codex/`
# config after the repository is trusted. Custom reviewer agents are defined as
# standalone TOML files under `.codex/agents/`.

model = "gpt-6-astra"

[agents]
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "high"
max_threads = 6
max_depth = 1
job_max_runtime_seconds = 1800
