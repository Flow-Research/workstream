# OAuth MCP listener; publish through the bounded HTTPS ingress only.
services:
  api:
    ports:
      - "127.0.0.1:8080:8080"
  mcp:
    image: ${WORKSTREAM_MCP_IMAGE:?set a digest-qualified MCP image}
    pull_policy: always
    network_mode: service:api
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure:5
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 64
    stop_grace_period: 30s
    environment:
      WORKSTREAM_API_URL: http://127.0.0.1:8000
      WORKSTREAM_MCP_HOST: 0.0.0.0
      WORKSTREAM_MCP_PORT: "8080"
      WORKSTREAM_MCP_MAX_IN_FLIGHT: "1"
      WORKSTREAM_MCP_ALLOWED_HOSTS: 127.0.0.1:8080,localhost:8080
      WORKSTREAM_MCP_TOKEN_ISSUER: ${WORKSTREAM_TOKEN_ISSUER:?set the exact external issuer}
      WORKSTREAM_MCP_RESOURCE_URL: ${WORKSTREAM_MCP_RESOURCE_URL:?set the canonical HTTPS MCP URL}
      WORKSTREAM_MCP_EXCHANGE_CLIENT_ID: workstream-mcp
      WORKSTREAM_MCP_API_AUDIENCE: ${WORKSTREAM_TOKEN_AUDIENCE:?set the exact API audience}
      WORKSTREAM_MCP_EXCHANGE_SECRET_FILE: /run/secrets/mcp-exchange-secret
    volumes:
      - type: bind
        source: ${WORKSTREAM_MCP_EXCHANGE_SECRET_FILE:?set the private MCP client secret file}
        target: /run/secrets/mcp-exchange-secret
        read_only: true
    healthcheck:
      test: [CMD, python, -m, workstream_mcp.healthcheck]
      interval: 10s
      timeout: 7s
      retries: 3
      start_period: 10s
