# Include from nginx's http context; replace identity.example.test with your
# issuer hostname. Issue a publicly trusted certificate before enabling TLS.
# The issuer container remains bound to 127.0.0.1:8443. No Workstream API or
# database port is published by this configuration.
limit_req_zone $binary_remote_addr zone=identity_login:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=identity_jwks:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=identity_connections:1m;

server {
    listen 80;
    server_name identity.example.test;
    access_log off;
    error_log /dev/null crit;
    location /.well-known/acme-challenge/ {
        root /var/lib/workstream-identity-acme;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name identity.example.test;
    ssl_certificate /etc/letsencrypt/live/identity.example.test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/identity.example.test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;
    limit_conn identity_connections 10;
    limit_req_status 429;
    add_header Cache-Control "no-store" always;

    proxy_ssl_server_name on;
    proxy_ssl_name identity.example.test;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 10s;
    proxy_next_upstream off;
    proxy_set_header Host identity.example.test;
    # The issuer does not trust forwarded client identity. Edge throttling
    # uses the real socket peer; spoofed forwarding headers confer no authority.
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";

    location = /jwks.json {
        limit_except GET { deny all; }
        limit_req zone=identity_jwks burst=10 nodelay;
        proxy_pass https://127.0.0.1:8443;
    }
    location ~ ^/(login|admin/accounts|me/password)$ {
        limit_except POST { deny all; }
        limit_req zone=identity_login burst=5 nodelay;
        proxy_pass https://127.0.0.1:8443;
    }
    location / { return 404; }
}
