name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME in the release environment file}

x-backend-environment: &backend-environment
  WORKSTREAM_ARTIFACT_ADMISSION_DEPLOYMENT_MAXIMUM_BYTES: "4294967296"
  WORKSTREAM_ARTIFACT_ADMISSION_PRODUCER_MAXIMUM_BYTES: "268435456"
  WORKSTREAM_ARTIFACT_ADMISSION_PROJECT_MAXIMUM_BYTES: "1073741824"
  WORKSTREAM_ARTIFACT_ADMISSION_TASK_MAXIMUM_BYTES: "67108864"
  WORKSTREAM_RELEASE_ID: ${WORKSTREAM_RELEASE_ID:?set the immutable release digest}
  WORKSTREAM_ARTIFACT_S3_ADDRESSING_STYLE: virtual
  WORKSTREAM_ARTIFACT_S3_AWS_WORKLOAD_IDENTITY_METHOD: ${WORKSTREAM_ARTIFACT_S3_AWS_WORKLOAD_IDENTITY_METHOD:?set the approved workload identity method}
  WORKSTREAM_ARTIFACT_S3_BOOTSTRAP_PRINCIPAL_ARN: ${WORKSTREAM_ARTIFACT_S3_BOOTSTRAP_PRINCIPAL_ARN:?set the exact bootstrap principal ARN}
  WORKSTREAM_ARTIFACT_S3_BUCKET: ${WORKSTREAM_ARTIFACT_S3_BUCKET:?set the private AWS S3 bucket}
  WORKSTREAM_ARTIFACT_S3_BUCKET_POLICY_SHA256: ${WORKSTREAM_ARTIFACT_S3_BUCKET_POLICY_SHA256:?set the exact bucket policy digest}
  WORKSTREAM_ARTIFACT_S3_CONNECT_TIMEOUT_SECONDS: ${WORKSTREAM_ARTIFACT_S3_CONNECT_TIMEOUT_SECONDS:?set the measured S3 connect timeout}
  WORKSTREAM_ARTIFACT_S3_CREDENTIAL_MODE: aws_workload_identity
  WORKSTREAM_ARTIFACT_S3_NEGATIVE_ROLE_ARN: ${WORKSTREAM_ARTIFACT_S3_NEGATIVE_ROLE_ARN:?set the exact negative-proof role ARN}
  WORKSTREAM_ARTIFACT_S3_NEGATIVE_TRUST_POLICY_SHA256: ${WORKSTREAM_ARTIFACT_S3_NEGATIVE_TRUST_POLICY_SHA256:?set the exact negative-proof trust policy digest}
  WORKSTREAM_ARTIFACT_S3_OPERATION_TOTAL_TIMEOUT_SECONDS: ${WORKSTREAM_ARTIFACT_S3_OPERATION_TOTAL_TIMEOUT_SECONDS:?set the measured total S3 operation timeout}
  WORKSTREAM_ARTIFACT_S3_POOL_TIMEOUT_SECONDS: ${WORKSTREAM_ARTIFACT_S3_POOL_TIMEOUT_SECONDS:?set the measured S3 pool timeout}
  WORKSTREAM_ARTIFACT_S3_PRIVATE_PREFIX: ${WORKSTREAM_ARTIFACT_S3_PRIVATE_PREFIX:?set the private artifact prefix}
  WORKSTREAM_ARTIFACT_S3_PROVIDER_PROFILE: aws_s3
  WORKSTREAM_ARTIFACT_S3_READINESS_POLICY_ARN: ${WORKSTREAM_ARTIFACT_S3_READINESS_POLICY_ARN:?set the exact readiness policy ARN}
  WORKSTREAM_ARTIFACT_S3_READINESS_ROLE_ARN: ${WORKSTREAM_ARTIFACT_S3_READINESS_ROLE_ARN:?set the exact readiness role ARN}
  WORKSTREAM_ARTIFACT_S3_READINESS_TRUST_POLICY_SHA256: ${WORKSTREAM_ARTIFACT_S3_READINESS_TRUST_POLICY_SHA256:?set the exact readiness trust policy digest}
  WORKSTREAM_ARTIFACT_S3_READ_TIMEOUT_SECONDS: ${WORKSTREAM_ARTIFACT_S3_READ_TIMEOUT_SECONDS:?set the measured S3 read timeout}
  WORKSTREAM_ARTIFACT_S3_REGION: ${WORKSTREAM_ARTIFACT_S3_REGION:?set the AWS region}
  WORKSTREAM_ARTIFACT_S3_ROLES_ANYWHERE_CERTIFICATE_FILE: /run/workstream-roles-anywhere/certificate.pem
  WORKSTREAM_ARTIFACT_S3_ROLES_ANYWHERE_PRIVATE_KEY_FILE: /run/workstream-roles-anywhere/private-key.pem
  WORKSTREAM_ARTIFACT_S3_ROLES_ANYWHERE_PROFILE_ARN: ${WORKSTREAM_ARTIFACT_S3_ROLES_ANYWHERE_PROFILE_ARN:?set the exact Roles Anywhere profile ARN}
  WORKSTREAM_ARTIFACT_S3_ROLES_ANYWHERE_PROFILE_SHA256: ${WORKSTREAM_ARTIFACT_S3_ROLES_ANYWHERE_PROFILE_SHA256:?set the canonical Roles Anywhere profile digest}
  WORKSTREAM_ARTIFACT_S3_ROLES_ANYWHERE_ROLE_ARN: ${WORKSTREAM_ARTIFACT_S3_RUNTIME_ROLE_ARN:?set the exact runtime role ARN}
  WORKSTREAM_ARTIFACT_S3_ROLES_ANYWHERE_TRUST_ANCHOR_ARN: ${WORKSTREAM_ARTIFACT_S3_ROLES_ANYWHERE_TRUST_ANCHOR_ARN:?set the exact Roles Anywhere trust anchor ARN}
  WORKSTREAM_ARTIFACT_S3_ROLES_ANYWHERE_TRUST_ANCHOR_SHA256: ${WORKSTREAM_ARTIFACT_S3_ROLES_ANYWHERE_TRUST_ANCHOR_SHA256:?set the canonical Roles Anywhere trust anchor digest}
  WORKSTREAM_ARTIFACT_S3_RUNTIME_POLICY_ARN: ${WORKSTREAM_ARTIFACT_S3_RUNTIME_POLICY_ARN:?set the exact runtime policy ARN}
  WORKSTREAM_ARTIFACT_S3_RUNTIME_ROLE_ARN: ${WORKSTREAM_ARTIFACT_S3_RUNTIME_ROLE_ARN:?set the exact runtime role ARN}
  WORKSTREAM_ARTIFACT_S3_RUNTIME_TRUST_POLICY_SHA256: ${WORKSTREAM_ARTIFACT_S3_RUNTIME_TRUST_POLICY_SHA256:?set the exact runtime trust policy digest}
  WORKSTREAM_ARTIFACT_S3_WRITE_TIMEOUT_SECONDS: ${WORKSTREAM_ARTIFACT_S3_WRITE_TIMEOUT_SECONDS:?set the measured S3 write timeout}
  WORKSTREAM_ARTIFACT_SCRATCH_ROOT: /var/lib/workstream/scratch
  WORKSTREAM_ARTIFACT_INTAKE_SERVICE_SOCKET: /var/lib/workstream/intake-runtime/checker.sock
  WORKSTREAM_ARTIFACT_INTAKE_IMAGE_DIGEST: ${WORKSTREAM_ARTIFACT_INTAKE_IMAGE_DIGEST:?set the pinned trusted intake image digest}
  WORKSTREAM_ARTIFACT_INTAKE_CONFIG_DIGEST: ${WORKSTREAM_ARTIFACT_INTAKE_CONFIG_DIGEST:?set the pinned trusted intake config digest}
  WORKSTREAM_ARTIFACT_STORE_BACKEND: s3_compatible
  WORKSTREAM_ARTIFACT_COMPLETE_READ_DEADLINE_SECONDS: ${WORKSTREAM_ARTIFACT_COMPLETE_READ_DEADLINE_SECONDS:?set the measured complete-read deadline}
  WORKSTREAM_ARTIFACT_TERMINAL_PERSISTENCE_MARGIN_SECONDS: ${WORKSTREAM_ARTIFACT_TERMINAL_PERSISTENCE_MARGIN_SECONDS:?set the measured terminal persistence margin}
  WORKSTREAM_AUTH_PROVIDER: flow
  WORKSTREAM_DEBUG: "false"
  WORKSTREAM_ENVIRONMENT: production
  WORKSTREAM_EXTERNAL_CHECKER_MATERIAL_ROOT: /var/lib/workstream/scratch
  WORKSTREAM_EXTERNAL_CHECKER_SERVICE_SOCKET: /var/lib/workstream/checker-runtime/checker.sock
  WORKSTREAM_OBSERVABILITY_LOG_LEVEL: ${WORKSTREAM_OBSERVABILITY_LOG_LEVEL:-INFO}
  WORKSTREAM_OBSERVABILITY_OTLP_ENDPOINT: ${WORKSTREAM_OBSERVABILITY_OTLP_ENDPOINT:-}
  WORKSTREAM_OBSERVABILITY_TRACE_SAMPLE_RATIO: ${WORKSTREAM_OBSERVABILITY_TRACE_SAMPLE_RATIO:-0.1}
  WORKSTREAM_PROJECT_AGENT_RUNTIME: ${WORKSTREAM_PROJECT_AGENT_RUNTIME:?set the trusted project agent runtime}
  WORKSTREAM_PROJECT_AGENT_MODEL_PROVIDER: ${WORKSTREAM_PROJECT_AGENT_MODEL_PROVIDER:?set the trusted project agent model provider}
  WORKSTREAM_PROJECT_AGENT_MODEL: ${WORKSTREAM_PROJECT_AGENT_MODEL:?set the trusted project agent model}
  WORKSTREAM_PROJECT_AGENT_MODEL_API: ${WORKSTREAM_PROJECT_AGENT_MODEL_API:?set the trusted project agent model API}
  WORKSTREAM_PROJECT_AGENT_RUNTIME_OPTIONS: ${WORKSTREAM_PROJECT_AGENT_RUNTIME_OPTIONS:?set the trusted project agent runtime options JSON}
  WORKSTREAM_PROJECT_AGENT_RUN_TIMEOUT_SECONDS: ${WORKSTREAM_PROJECT_AGENT_RUN_TIMEOUT_SECONDS:?set the whole-run deadline}
  WORKSTREAM_PROJECT_AGENT_MAX_MANIFEST_BYTES: ${WORKSTREAM_PROJECT_AGENT_MAX_MANIFEST_BYTES:?set the guide manifest budget}
  WORKSTREAM_PROJECT_AGENT_MAX_DOCUMENTS: ${WORKSTREAM_PROJECT_AGENT_MAX_DOCUMENTS:?set the guide document-count budget}
  WORKSTREAM_PROJECT_AGENT_MAX_DOCUMENT_BYTES: ${WORKSTREAM_PROJECT_AGENT_MAX_DOCUMENT_BYTES:?set the per-document byte budget}
  WORKSTREAM_PROJECT_AGENT_MAX_TOTAL_DOCUMENT_BYTES: ${WORKSTREAM_PROJECT_AGENT_MAX_TOTAL_DOCUMENT_BYTES:?set the aggregate document byte budget}
  WORKSTREAM_PROJECT_AGENT_MAX_TURNS: ${WORKSTREAM_PROJECT_AGENT_MAX_TURNS:?set the agent turn budget}
  WORKSTREAM_PROJECT_AGENT_MAX_TOOL_CALLS: ${WORKSTREAM_PROJECT_AGENT_MAX_TOOL_CALLS:?set the guide tool-call budget}
  WORKSTREAM_PROJECT_AGENT_MAX_TOOL_OUTPUT_CHARACTERS: ${WORKSTREAM_PROJECT_AGENT_MAX_TOOL_OUTPUT_CHARACTERS:?set the aggregate guide tool-output budget}
  WORKSTREAM_REQUIRED_HUMAN_SCOPE: ${WORKSTREAM_REQUIRED_HUMAN_SCOPE:?set the Flow human scope}
  WORKSTREAM_REQUIRED_SERVICE_SCOPE: ${WORKSTREAM_REQUIRED_SERVICE_SCOPE:?set the Flow service scope}
  WORKSTREAM_TOKEN_ALGORITHMS: ${WORKSTREAM_TOKEN_ALGORITHMS:?set the pinned Flow algorithms}
  WORKSTREAM_TOKEN_AUDIENCE: ${WORKSTREAM_TOKEN_AUDIENCE:?set the Flow audience}
  WORKSTREAM_TOKEN_INTROSPECTION_DISABLED_REASON: ${WORKSTREAM_TOKEN_INTROSPECTION_DISABLED_REASON:?document the Flow issuer introspection policy}
  WORKSTREAM_TOKEN_INTROSPECTION_MODE: ${WORKSTREAM_TOKEN_INTROSPECTION_MODE:?set the Flow introspection policy}
  WORKSTREAM_TOKEN_ISSUER: ${WORKSTREAM_TOKEN_ISSUER:?set the Flow issuer}
  WORKSTREAM_TOKEN_JWKS_URL: ${WORKSTREAM_TOKEN_JWKS_URL:?set the Flow JWKS URL}

x-backend-runtime: &backend-runtime
  image: ${WORKSTREAM_BACKEND_IMAGE:?set a digest-qualified backend image}
  pull_policy: always
  init: true
  user: "${WORKSTREAM_RUNTIME_UID:?set runtime UID}:${WORKSTREAM_RUNTIME_GID:?set runtime GID}"
  environment: *backend-environment
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:mode=0700,uid=${WORKSTREAM_RUNTIME_UID},gid=${WORKSTREAM_RUNTIME_GID}

x-proof-environment: &proof-environment
  <<: *backend-environment
  WORKSTREAM_RELEASE_ROLE: proof
  WORKSTREAM_DATABASE_URL_FILE: /run/secrets/database_url

x-proof-job: &proof-job
  <<: *backend-runtime
  pull_policy: never
  profiles: [aws-proof]
  environment: *proof-environment
  secrets:
    - source: database_url
      target: database_url
      uid: "${WORKSTREAM_RUNTIME_UID}"
      gid: "${WORKSTREAM_RUNTIME_GID}"
      mode: 0400
  command: [/bin/false]

services:
  guide-document-parser:
    image: ${WORKSTREAM_BACKEND_IMAGE:?set a digest-qualified backend image}
    pull_policy: always
    init: true
    user: "0:0"
    environment:
      WORKSTREAM_RELEASE_ROLE: parser
      WORKSTREAM_GUIDE_DOCUMENT_PARSER_SOCKET: /var/lib/workstream/guide-runtime/guide.sock
    command:
      - python
      - -m
      - app.adapters.guide_document_tools.service
      - --socket
      - /var/lib/workstream/guide-runtime/guide.sock
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [KILL, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 64
    restart: on-failure:5
    stop_grace_period: 30s
    tmpfs:
      - /tmp:mode=0700,uid=10002,gid=10001,size=268435456,noexec,nosuid,nodev
    volumes:
      - type: bind
        source: /var/lib/workstream/guide-runtime
        target: /var/lib/workstream/guide-runtime
    healthcheck:
      test: [CMD, python, -m, app.adapters.guide_document_tools.service, --healthcheck, --socket, /var/lib/workstream/guide-runtime/guide.sock]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  checker-service:
    image: ${WORKSTREAM_CHECKER_SERVICE_IMAGE:?set a digest-qualified checker-service image}
    pull_policy: always
    init: true
    user: "${WORKSTREAM_RUNTIME_UID}:${WORKSTREAM_RUNTIME_GID}"
    group_add: ["${WORKSTREAM_DOCKER_SOCKET_GID:?set the Docker socket group ID}"]
    command: [/etc/workstream/checker-service.json]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: on-failure:5
    tmpfs:
      - /tmp:mode=0700,uid=${WORKSTREAM_RUNTIME_UID},gid=${WORKSTREAM_RUNTIME_GID}
    volumes:
      - type: bind
        source: ${WORKSTREAM_CHECKER_CONFIG_FILE:?set the private checker config path}
        target: /etc/workstream/checker-service.json
        read_only: true
      - type: bind
        source: /var/lib/workstream/scratch
        target: /var/lib/workstream/scratch
        read_only: true
      - type: bind
        source: /var/lib/workstream/checker-runtime
        target: /var/lib/workstream/checker-runtime
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    healthcheck:
      test: [CMD-SHELL, "test -S /var/lib/workstream/checker-runtime/checker.sock && docker info --format '{{json .Runtimes.runsc}}' | grep -vq '^null$'"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 10s

  api:
    <<: *backend-runtime
    environment:
      <<: *backend-environment
      WORKSTREAM_RELEASE_ROLE: api
      WORKSTREAM_DATABASE_URL_FILE: /run/secrets/database_url
      WORKSTREAM_CELERY_BROKER_URL_FILE: /run/secrets/celery_broker_url
      WORKSTREAM_API_RATE_LIMIT_KEY_SECRET_FILE: /run/secrets/api_rate_limit_key
      WORKSTREAM_PAGINATION_CURSOR_HMAC_SECRET_FILE: /run/secrets/pagination_cursor_hmac
    secrets:
      - source: database_url
        target: database_url
        uid: "${WORKSTREAM_RUNTIME_UID}"
        gid: "${WORKSTREAM_RUNTIME_GID}"
        mode: 0400
      - source: celery_broker_url
        target: celery_broker_url
        uid: "${WORKSTREAM_RUNTIME_UID}"
        gid: "${WORKSTREAM_RUNTIME_GID}"
        mode: 0400
      - source: api_rate_limit_key
        target: api_rate_limit_key
        uid: "${WORKSTREAM_RUNTIME_UID}"
        gid: "${WORKSTREAM_RUNTIME_GID}"
        mode: 0400
      - source: pagination_cursor_hmac
        target: pagination_cursor_hmac
        uid: "${WORKSTREAM_RUNTIME_UID}"
        gid: "${WORKSTREAM_RUNTIME_GID}"
        mode: 0400
    command:
      - /bin/sh
      - -c
      - python -m alembic upgrade head && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:${WORKSTREAM_API_HOST_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: /var/lib/workstream/scratch
        target: /var/lib/workstream/scratch
      - type: bind
        source: /var/lib/workstream/checker-runtime
        target: /var/lib/workstream/checker-runtime
        read_only: true
      - type: bind
        source: /var/lib/workstream/intake-runtime
        target: /var/lib/workstream/intake-runtime
        read_only: true
      - type: bind
        source: ${WORKSTREAM_ARTIFACT_S3_ROLES_ANYWHERE_RUNTIME_CERTIFICATE_HOST_FILE:?set the private runtime certificate path}
        target: /run/workstream-roles-anywhere/certificate.pem
        read_only: true
      - type: bind
        source: ${WORKSTREAM_ARTIFACT_S3_ROLES_ANYWHERE_RUNTIME_PRIVATE_KEY_HOST_FILE:?set the private runtime key path}
        target: /run/workstream-roles-anywhere/private-key.pem
        read_only: true
    depends_on:
      checker-service:
        condition: service_healthy
    restart: on-failure:5
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

  worker:
    <<: *backend-runtime
    environment:
      <<: *backend-environment
      WORKSTREAM_RELEASE_ROLE: worker
      WORKSTREAM_DATABASE_URL_FILE: /run/secrets/database_url
      WORKSTREAM_CELERY_BROKER_URL_FILE: /run/secrets/celery_broker_url
      WORKSTREAM_GUIDE_DOCUMENT_PARSER_SOCKET: /var/lib/workstream/guide-runtime/guide.sock
    secrets:
      - source: database_url
        target: database_url
        uid: "${WORKSTREAM_RUNTIME_UID}"
        gid: "${WORKSTREAM_RUNTIME_GID}"
        mode: 0400
      - source: celery_broker_url
        target: celery_broker_url
        uid: "${WORKSTREAM_RUNTIME_UID}"
        gid: "${WORKSTREAM_RUNTIME_GID}"
        mode: 0400
    command:
      - python
      - -m
      - celery
      - -A
      - app.workers.celery_app
      - worker
      - --pool=prefork
      - --concurrency=${WORKSTREAM_CELERY_WORKER_CONCURRENCY:-2}
      - --hostname=worker@%h
      - --pidfile=/tmp/celery-worker.pid
      - --loglevel=INFO
    volumes:
      - type: bind
        source: /var/lib/workstream/scratch
        target: /var/lib/workstream/scratch
      - type: bind
        source: /var/lib/workstream/checker-runtime
        target: /var/lib/workstream/checker-runtime
        read_only: true
      - type: bind
        source: /var/lib/workstream/intake-runtime
        target: /var/lib/workstream/intake-runtime
        read_only: true
      - type: bind
        source: /var/lib/workstream/guide-runtime
        target: /var/lib/workstream/guide-runtime
        read_only: true
      - type: bind
        source: ${WORKSTREAM_ARTIFACT_S3_ROLES_ANYWHERE_RUNTIME_CERTIFICATE_HOST_FILE:?set the private runtime certificate path}
        target: /run/workstream-roles-anywhere/certificate.pem
        read_only: true
      - type: bind
        source: ${WORKSTREAM_ARTIFACT_S3_ROLES_ANYWHERE_RUNTIME_PRIVATE_KEY_HOST_FILE:?set the private runtime key path}
        target: /run/workstream-roles-anywhere/private-key.pem
        read_only: true
    depends_on:
      api:
        condition: service_healthy
      checker-service:
        condition: service_healthy
      guide-document-parser:
        condition: service_healthy
    restart: on-failure:5
    stop_grace_period: 7320s
    healthcheck:
      test: [CMD-SHELL, "test -s /tmp/celery-worker.pid && kill -0 $$(cat /tmp/celery-worker.pid)"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s

  beat:
    <<: *backend-runtime
    environment:
      <<: *backend-environment
      WORKSTREAM_RELEASE_ROLE: beat
      WORKSTREAM_DATABASE_URL_FILE: /run/secrets/database_url
      WORKSTREAM_CELERY_BROKER_URL_FILE: /run/secrets/celery_broker_url
    secrets:
      - source: database_url
        target: database_url
        uid: "${WORKSTREAM_RUNTIME_UID}"
        gid: "${WORKSTREAM_RUNTIME_GID}"
        mode: 0400
      - source: celery_broker_url
        target: celery_broker_url
        uid: "${WORKSTREAM_RUNTIME_UID}"
        gid: "${WORKSTREAM_RUNTIME_GID}"
        mode: 0400
    command:
      - python
      - -m
      - celery
      - -A
      - app.workers.celery_app
      - beat
      - --schedule=/tmp/celerybeat-schedule
      - --pidfile=/tmp/celerybeat.pid
      - --loglevel=INFO
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure:5
    stop_grace_period: 30s
    healthcheck:
      test: [CMD-SHELL, "test -s /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s

  aws-proof-runtime:
    <<: *proof-job
    volumes:
      - type: bind
        source: ${WORKSTREAM_ARTIFACT_S3_ROLES_ANYWHERE_RUNTIME_CERTIFICATE_HOST_FILE:?set the private runtime proof certificate path}
        target: /run/workstream-roles-anywhere/certificate.pem
        read_only: true
      - type: bind
        source: ${WORKSTREAM_ARTIFACT_S3_ROLES_ANYWHERE_RUNTIME_PRIVATE_KEY_HOST_FILE:?set the private runtime proof key path}
        target: /run/workstream-roles-anywhere/private-key.pem
        read_only: true

  aws-proof-readiness:
    <<: *proof-job
    environment:
      <<: *proof-environment
      WORKSTREAM_ARTIFACT_S3_ROLES_ANYWHERE_ROLE_ARN: ${WORKSTREAM_ARTIFACT_S3_READINESS_ROLE_ARN:?set the exact readiness role ARN}
    volumes:
      - type: bind
        source: ${WORKSTREAM_ARTIFACT_S3_ROLES_ANYWHERE_READINESS_CERTIFICATE_HOST_FILE:?set the private readiness proof certificate path}
        target: /run/workstream-roles-anywhere/certificate.pem
        read_only: true
      - type: bind
        source: ${WORKSTREAM_ARTIFACT_S3_ROLES_ANYWHERE_READINESS_PRIVATE_KEY_HOST_FILE:?set the private readiness proof key path}
        target: /run/workstream-roles-anywhere/private-key.pem
        read_only: true

  aws-proof-negative:
    <<: *proof-job
    environment:
      <<: *proof-environment
      WORKSTREAM_ARTIFACT_S3_ROLES_ANYWHERE_ROLE_ARN: ${WORKSTREAM_ARTIFACT_S3_NEGATIVE_ROLE_ARN:?set the exact negative-proof role ARN}
    volumes:
      - type: bind
        source: ${WORKSTREAM_ARTIFACT_S3_ROLES_ANYWHERE_NEGATIVE_CERTIFICATE_HOST_FILE:?set the private negative proof certificate path}
        target: /run/workstream-roles-anywhere/certificate.pem
        read_only: true
      - type: bind
        source: ${WORKSTREAM_ARTIFACT_S3_ROLES_ANYWHERE_NEGATIVE_PRIVATE_KEY_HOST_FILE:?set the private negative proof key path}
        target: /run/workstream-roles-anywhere/private-key.pem
        read_only: true

  aws-proof-coordinate:
    <<: *proof-job

secrets:
  database_url:
    file: ${WORKSTREAM_DATABASE_URL_FILE:?set the private database URL file}
  celery_broker_url:
    file: ${WORKSTREAM_CELERY_BROKER_URL_FILE:?set the private broker URL file}
  api_rate_limit_key:
    file: ${WORKSTREAM_API_RATE_LIMIT_KEY_SECRET_FILE:?set the private rate-limit key file}
  pagination_cursor_hmac:
    file: ${WORKSTREAM_PAGINATION_CURSOR_HMAC_SECRET_FILE:?set the private cursor key file}
