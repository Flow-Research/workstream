name: CLI Public Contract

on:
  workflow_call:

permissions:
  contents: read

jobs:
  cli-public-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: workstream
          POSTGRES_PASSWORD: workstream
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U workstream -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Bind checked-out source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"

      - name: Verify and build independent CLI
        working-directory: cli
        env:
          CGO_ENABLED: "0"
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          go mod tidy -diff
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go build -trimpath -ldflags "-X main.version=${GITHUB_SHA}" -o "${RUNNER_TEMP}/workstream-cli" ./cmd/workstream

      - name: Install API integration tooling
        run: |
          python -m pip install -e "./backend[dev,agents]"
          python -m pip install ruff==0.15.22

      - name: Check integration test source
        run: |
          ruff check cli/tests
          ruff format --check cli/tests

      - name: Exercise built CLI against HTTP boundaries and real public API
        working-directory: backend
        env:
          WORKSTREAM_CLI_EXECUTABLE: ${{ runner.temp }}/workstream-cli
          WORKSTREAM_TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://workstream:workstream@localhost:5433/postgres
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_isolated_tests.py \
            --metadata-json "${RUNNER_TEMP}/workstream-cli-isolation.json" \
            --timeout-seconds 240 \
            -- python -m pytest -q ../cli/tests/integration
