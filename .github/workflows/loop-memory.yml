name: Loop Memory

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - loop-memory-replay

permissions:
  checks: read
  contents: write
  pull-requests: read
  statuses: read

concurrency:
  group: workstream-loop-memory
  cancel-in-progress: false

jobs:
  loop-memory:
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      EVENT_SHA: ${{ github.event_name == 'push' && github.sha || github.event.client_payload.target_sha }}
      STATE_BRANCH: automation/loop-memory

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main

      - name: Resolve trusted protected-main target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${EVENT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid event SHA." >&2
            exit 1
          fi
          gh auth setup-git
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          target_sha=$(git rev-parse --verify refs/remotes/origin/main)
          if [[ ! "${target_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Cannot resolve protected main." >&2
            exit 1
          fi
          target_sha=$(python3 scripts/update_post_merge_memory.py resolve-target \
            --repository-root . \
            --event-name "${EVENT_NAME}" \
            --event-sha "${EVENT_SHA}" \
            --current-main-sha "${target_sha}")
          git checkout --detach "${target_sha}"
          echo "TARGET_SHA=${target_sha}" >> "${GITHUB_ENV}"

      - name: Prepare generated state branch
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          state_dir="${RUNNER_TEMP}/loop-memory-state"
          if git ls-remote --exit-code --heads origin "refs/heads/${STATE_BRANCH}" >/dev/null; then
            git clone --depth 1 --single-branch --branch "${STATE_BRANCH}" \
              "https://github.com/${GITHUB_REPOSITORY}.git" "${state_dir}"
          else
            mkdir -p "${state_dir}"
            git -C "${state_dir}" init --initial-branch "${STATE_BRANCH}"
            git -C "${state_dir}" remote add origin \
              "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          python3 scripts/update_post_merge_memory.py prepare-state \
            --state-root "${state_dir}" \
            --public-key .agent-loop/keys/loop-memory-signing-public.pem
          echo "state_dir=${state_dir}" >> "${GITHUB_OUTPUT}"
          output_dir="${RUNNER_TEMP}/loop-memory-output"
          python3 scripts/update_post_merge_memory.py prepare-output \
            --source-root "${state_dir}" \
            --output-root "${output_dir}" \
            --public-key .agent-loop/keys/loop-memory-signing-public.pem
          echo "output_dir=${output_dir}" >> "${GITHUB_OUTPUT}"

      - name: Reconcile every unrecorded main commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state_dir="${{ steps.state.outputs.output_dir }}"
          branch_dir="${{ steps.state.outputs.state_dir }}"
          if [[ ! "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid protected-main target SHA." >&2
            exit 1
          fi
          python3 scripts/update_post_merge_memory.py reconcile \
            --repository "${GITHUB_REPOSITORY}" --repository-root . \
            --state-root "${state_dir}" --branch-root "${branch_dir}" \
            --target-sha "${TARGET_SHA}"

      - name: Validate generated state
        shell: bash
        env:
          LOOP_MEMORY_SIGNING_KEY: ${{ secrets.LOOP_MEMORY_SIGNING_KEY }}
        run: |
          set -euo pipefail
          state_dir="${{ steps.state.outputs.output_dir }}"
          private_key="${RUNNER_TEMP}/loop-memory-signing-key.pem"
          trap 'rm -f "${private_key}"' EXIT
          printf '%s\n' "${LOOP_MEMORY_SIGNING_KEY}" > "${private_key}"
          chmod 600 "${private_key}"
          python3 scripts/update_post_merge_memory.py sign-state \
            --state-root "${state_dir}" \
            --private-key "${private_key}"
          python3 scripts/update_post_merge_memory.py verify-state \
            --state-root "${state_dir}" \
            --public-key .agent-loop/keys/loop-memory-signing-public.pem \
            --expected-main-sha "${TARGET_SHA}"
          python3 scripts/check_loop_memory_state.py \
            --state-root "${state_dir}" --repository-root .

      - name: Commit generated state branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state_dir="${{ steps.state.outputs.state_dir }}"
          output_dir="${{ steps.state.outputs.output_dir }}"
          parent_sha=""
          if git -C "${state_dir}" rev-parse --verify HEAD >/dev/null 2>&1; then
            parent_sha=$(git -C "${state_dir}" rev-parse HEAD)
          fi
          pr_number=$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["source"]["pr_number"])' \
              "${output_dir}/.agent-loop/STATE.json")
          git -C "${state_dir}" config user.name "workstream-loop-memory[bot]"
          git -C "${state_dir}" config user.email \
            "workstream-loop-memory[bot]@users.noreply.github.com"
          python3 scripts/update_post_merge_memory.py publish \
            --branch-root "${state_dir}" --output-root "${output_dir}" \
            --expected-prior-tip "${parent_sha}" \
            --message "chore(loop-memory): record PR #${pr_number}"
