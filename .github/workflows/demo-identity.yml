name: Demo identity issuer

on:
  pull_request:
    paths:
      - 'experiments/demo_identity/**'
      - 'deploy/hosted/compose.demo-identity.yml'
      - 'deploy/hosted/compose.yml'
      - 'deploy/hosted/release.env.example'
      - 'deploy/hosted/preflight.py'
      - 'deploy/hosted/compose.py'
      - 'deploy/hosted/demo-identity.Caddyfile'
      - 'deploy/hosted/public.Caddyfile'
      - 'scripts/test_public_ingress.py'
      - 'deploy/hosted/demo-identity-caddy.service'
      - 'backend/app/adapters/auth/flow.py'
      - '.dockerignore'
      - '.github/workflows/demo-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issuer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install issuer Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.99.1
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.1
      - name: Verify Rust issuer
        working-directory: experiments/demo_identity
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked -- --test-threads=1
          cargo build --release --locked
      - name: Build issuer container and check executable
        shell: bash
        run: |
          set -euo pipefail
          docker build --file experiments/demo_identity/Dockerfile --tag workstream-demo-identity:ci .
          if docker run --rm workstream-demo-identity:ci >/tmp/demo-identity-smoke.out 2>&1; then
            echo 'issuer unexpectedly started without configuration' >&2
            exit 1
          fi
          grep -q 'usage: demo-identity' /tmp/demo-identity-smoke.out
      - name: Prove real issuer loopback HTTPS and account persistence
        run: python3 experiments/demo_identity/test_container.py -q
      - name: Validate Caddy HTTPS ingress configuration
        shell: bash
        run: |
          set -euo pipefail
          proof=$(mktemp -d)
          trap 'rm -rf "$proof"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=identity.example.test' \
            -addext 'subjectAltName=DNS:identity.example.test' \
            -keyout "$proof/key.pem" -out "$proof/cert.pem" >/dev/null 2>&1
          docker run --rm --network none \
            -e DEMO_IDENTITY_HOSTNAME=identity.example.test \
            -e DEMO_IDENTITY_UPSTREAM_CERT=/proof/cert.pem \
            -v "$PWD/deploy/hosted/demo-identity.Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$proof/cert.pem:/proof/cert.pem:ro" \
            caddy@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Prove public ingress routing with the pinned Caddy binary
        shell: bash
        run: |
          set -euo pipefail
          proof=$(mktemp -d)
          container=$(docker create caddy@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9)
          trap 'docker rm -f "$container" >/dev/null; rm -rf "$proof"' EXIT
          docker cp "$container:/usr/bin/caddy" "$proof/caddy"
          WORKSTREAM_TEST_CADDY="$proof/caddy" python3 scripts/test_public_ingress.py -q
      - name: Verify hosted Compose issuer network boundary
        shell: bash
        run: |
          set -euo pipefail
          export DEMO_IDENTITY_IMAGE='example.invalid/demo@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          export DEMO_IDENTITY_ISSUER='https://identity.example.test:8443'
          export DEMO_IDENTITY_AUDIENCE='workstream-demo'
          export DEMO_IDENTITY_DATA_DIR='/tmp/demo-state'
          export DEMO_IDENTITY_TLS_CERT_FILE='/tmp/demo-cert.pem'
          export DEMO_IDENTITY_TLS_KEY_FILE='/tmp/demo-key.pem'
          export DEMO_IDENTITY_HOSTNAME='identity.example.test'
          docker compose --env-file deploy/hosted/release.env.example \
            -f deploy/hosted/compose.yml -f deploy/hosted/compose.demo-identity.yml \
            config --format json > /tmp/demo-identity-compose.json
          python3 - <<'PY'
          import json
          with open('/tmp/demo-identity-compose.json', encoding='utf-8') as stream:
              config = json.load(stream)
          services = config['services']
          assert set(services['demo-identity']['networks']) == {'demo_identity'}
          assert set(services['api']['networks']) == {'default'}
          assert config['networks']['demo_identity']['driver'] == 'bridge'
          assert config['networks']['demo_identity'].get('internal', False) is False
          assert services['demo-identity']['read_only'] is True
          assert services['demo-identity']['user'] == '12001:12001'
          PY
      - name: Install frozen backend test dependencies
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'uv==0.10.7'
          uv lock --check
          uv sync --frozen --extra dev
      - name: Verify real HTTPS and unchanged Workstream verifier
        shell: bash
        env:
          PYTHONPATH: backend
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: backend/.venv/bin/python -m pytest -q experiments/demo_identity/test_service.py
