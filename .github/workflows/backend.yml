name: Backend

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  MINIO_IMAGE: quay.io/minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_DB: workstream_test
          POSTGRES_USER: workstream
          POSTGRES_PASSWORD: workstream
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U workstream -d workstream_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - id: identity
        name: Bind exact checked-out tree
        shell: bash
        run: |
          set -euo pipefail
          job_start_epoch="$(date +%s)"
          tree_sha="$(git rev-parse HEAD)"
          test "${tree_sha}" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse "${tree_sha}^{tree}")" = "$(git rev-parse HEAD^{tree})"
          echo "job_start_epoch=${job_start_epoch}" >> "${GITHUB_OUTPUT}"
          echo "tree_sha=${tree_sha}" >> "${GITHUB_OUTPUT}"

      - name: Install backend and exact Ruff
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install ruff==0.15.22
          test "$(ruff --version)" = "ruff 0.15.22"

      - name: Lint
        working-directory: backend
        run: ruff check app tests scripts

      - name: Docstring coverage
        working-directory: backend
        run: docstr-coverage --config .docstr.yaml

      - name: Start real MinIO artifact provider
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name workstream-minio \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER=workstream-minio \
            --env MINIO_ROOT_PASSWORD=workstream-minio-secret-key \
            "${MINIO_IMAGE}" server /data --address :9000
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs workstream-minio
          exit 1

      - name: Collect canonical semantic-lane inventory
        working-directory: backend
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 .ci/test-lanes
          python scripts/run_test_lanes.py \
            --collect-only \
            --metadata-dir .ci/test-lanes/collect \
            --summary-json .ci/test-lanes/collect-summary.json

      - name: Validate canonical semantic-lane inventory
        working-directory: backend
        run: >-
          python scripts/validate_test_lane_evidence.py
          --metadata-dir .ci/test-lanes/collect
          --summary-json .ci/test-lanes/collect-summary.json

      - name: Execute four semantic lanes
        working-directory: backend
        env:
          COVERAGE_FILE: .coverage
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          WORKSTREAM_TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://workstream:workstream@localhost:5433/postgres
          WORKSTREAM_TEST_MINIO_ENDPOINT: http://127.0.0.1:9000
        shell: bash
        run: |
          set -uo pipefail
          rm -f .coverage .coverage.*
          lane_exit=0
          python scripts/run_test_lanes.py \
            --metadata-dir .ci/test-lanes/run \
            --summary-json .ci/test-lanes/run-summary.json \
            --timeout-seconds 1200 || lane_exit=$?
          printf '%s\n' "${lane_exit}" > .ci/test-lanes/run.exit

      - name: Independently validate completed-node and coverage custody
        working-directory: backend
        run: >-
          python scripts/validate_test_lane_evidence.py
          --metadata-dir .ci/test-lanes/run
          --summary-json .ci/test-lanes/run-summary.json

      - name: Require semantic-lane execution success
        shell: bash
        working-directory: backend
        run: test "$(cat .ci/test-lanes/run.exit)" = 0

      - name: Combine semantic-lane coverage exactly once
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          coverage_files=(.ci/test-lanes/run/.coverage.*)
          test "${#coverage_files[@]}" -eq 4
          for source in "${coverage_files[@]}"; do
            test -f "${source}"
            test ! -L "${source}"
            destination="$(basename "${source}")"
            test ! -e "${destination}"
            cp -- "${source}" "${destination}"
            test "$(sha256sum "${source}" | cut -d' ' -f1)" = \
              "$(sha256sum "${destination}" | cut -d' ' -f1)"
          done
          coverage combine

      - name: API contract real API e2e
        working-directory: backend
        env:
          WORKSTREAM_TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://workstream:workstream@localhost:5433/postgres
        run: >-
          python scripts/run_isolated_tests.py
          --metadata-json "${RUNNER_TEMP}/api-database.json"
          --timeout-seconds 1500
          -- python scripts/api_contract_e2e.py

      - name: Backend full-suite coverage
        working-directory: backend
        run: coverage report --precision=2 --fail-under=78

      - name: Artifact foundation coverage
        working-directory: backend
        run: >-
          coverage report
          --include='app/adapters/artifacts/*,app/core/cancellation.py,app/core/file_locks.py,app/interfaces/artifact_operations.py,app/interfaces/artifacts.py,app/modules/artifacts/*'
          --precision=2
          --fail-under=90

      - name: External service adapter coverage
        working-directory: backend
        run: coverage report --include='app/interfaces/external_services.py' --precision=2 --fail-under=90

      - name: Artifact preparation configuration coverage
        working-directory: backend
        run: coverage report --include='app/core/config.py' --precision=2 --fail-under=90

      - name: Artifact worker wiring coverage
        working-directory: backend
        run: coverage report --include='app/workers/*' --precision=2 --fail-under=90

      - name: FastAPI startup wiring coverage
        working-directory: backend
        run: coverage report --include='app/main.py' --precision=2 --fail-under=90

      - name: S3-compatible artifact adapter coverage
        working-directory: backend
        run: coverage report --include='app/adapters/artifacts/s3_compatible.py' --precision=2 --fail-under=90

      - name: S3 namespace validation coverage
        working-directory: backend
        run: coverage report --include='app/core/s3_validation.py' --precision=2 --fail-under=90

      - name: Audit subsystem coverage
        working-directory: backend
        run: coverage report --include='app/modules/audit/*' --precision=2 --fail-under=90

      - name: API router composition coverage
        working-directory: backend
        run: coverage report --include='app/api/router.py' --precision=2 --fail-under=90

      - name: Actor subsystem coverage
        working-directory: backend
        run: coverage report --include='app/modules/actors/*' --precision=2 --fail-under=90

      - name: Authorization subsystem coverage
        working-directory: backend
        run: coverage report --include='app/modules/authorization/*' --precision=2 --fail-under=90

      - name: Project creation cutover per-file coverage
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          for source in \
            app/api/deps/authorization.py \
            app/modules/audit/schemas.py \
            app/modules/authorization/catalogue.py \
            app/modules/authorization/kernel.py \
            app/modules/authorization/prepared.py \
            app/modules/authorization/runtime.py \
            app/db/errors.py \
            app/modules/projects/models.py \
            app/modules/projects/create_repository.py \
            app/modules/projects/create_router.py \
            app/modules/projects/create_service.py
          do
            coverage report --include="${source}" --precision=2 --fail-under=90
          done

      - name: Project authorization-read composer coverage
        working-directory: backend
        run: |
          COVERAGE_FILE=.coverage-project-auth-read pytest -q tests/test_projects.py \
            -k 'project_diagnostic_read_composer or project_policy_read_composer or project_active_guide_read_composer' \
            --cov=app.modules.projects.authorization_reads \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=90

      - name: Guide metadata mutation per-file coverage
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          for source in \
            app/modules/projects/guide_mutation_repository.py \
            app/modules/projects/guide_mutation_router.py \
            app/modules/projects/guide_mutation_service.py
          do
            coverage report --include="${source}" --precision=2 --fail-under=90
          done

      - name: API controls coverage
        working-directory: backend
        run: >-
          coverage report
          --include='app/modules/api_controls/*,app/api/deps/api_controls.py'
          --precision=2
          --fail-under=90

      - name: Task subsystem coverage
        working-directory: backend
        run: coverage report --include='app/modules/tasks/*' --precision=2 --fail-under=90

      - name: Auth verifier boundary coverage
        working-directory: backend
        run: >-
          coverage report
          --include='app/interfaces/auth.py,app/core/auth.py,app/adapters/auth/dev.py,app/adapters/auth/flow.py'
          --precision=2
          --fail-under=90

      - name: Record hosted timing and fail-closed coverage evidence
        working-directory: backend
        env:
          EXPECTED_HEAD_SHA: ${{ steps.identity.outputs.tree_sha }}
          JOB_START_EPOCH: ${{ steps.identity.outputs.job_start_epoch }}
        shell: bash
        run: |
          set -euo pipefail
          coverage json -o .ci/test-lanes/coverage.json
          python - <<'PY'
          from __future__ import annotations

          from collections import Counter
          import hashlib
          import json
          import math
          import os
          from pathlib import Path
          import subprocess
          import time

          evidence_root = Path(".ci/test-lanes")
          run_root = evidence_root / "run"
          summary_path = evidence_root / "run-summary.json"
          coverage_path = evidence_root / "coverage.json"
          output_path = Path(".ci/test-lanes/hosted-evidence.json")

          def read_json(path: Path) -> dict[str, object]:
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"invalid hosted evidence input: {path}")
              value = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(value, dict):
                  raise SystemExit(f"invalid hosted evidence object: {path}")
              return value

          def digest(path: Path) -> str:
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"invalid hosted digest input: {path}")
              return hashlib.sha256(path.read_bytes()).hexdigest()

          expected_head = os.environ["EXPECTED_HEAD_SHA"]
          actual_head = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          summary = read_json(summary_path)
          coverage = read_json(coverage_path)
          if actual_head != expected_head or summary.get("head_sha") != expected_head:
              raise SystemExit("hosted evidence head drift")

          lanes = summary.get("lanes")
          if not isinstance(lanes, list) or len(lanes) != 4:
              raise SystemExit("invalid hosted lane inventory")
          collected: list[str] = []
          completed: list[str] = []
          lane_elapsed: list[float] = []
          for lane in lanes:
              if not isinstance(lane, dict):
                  raise SystemExit("invalid hosted lane row")
              elapsed = lane.get("elapsed_seconds")
              if (
                  isinstance(elapsed, bool)
                  or not isinstance(elapsed, (int, float))
                  or not math.isfinite(elapsed)
                  or elapsed < 0
              ):
                  raise SystemExit("invalid hosted lane timing")
              lane_elapsed.append(float(elapsed))
              for file_key, digest_key in (
                  ("evidence_file", "evidence_sha256"),
                  ("coverage_file", "coverage_sha256"),
              ):
                  name = lane.get(file_key)
                  expected_digest = lane.get(digest_key)
                  if not isinstance(name, str) or not isinstance(expected_digest, str):
                      raise SystemExit("invalid hosted lane digest binding")
                  path = run_root / name
                  if path.parent != run_root or digest(path) != expected_digest:
                      raise SystemExit("hosted lane digest drift")
              lane_evidence = read_json(run_root / str(lane["evidence_file"]))
              lane_collected = lane_evidence.get("collected_nodes")
              lane_completed = lane_evidence.get("completed_nodes")
              if not isinstance(lane_collected, list) or not isinstance(lane_completed, list):
                  raise SystemExit("invalid hosted node custody")
              collected.extend(lane_collected)
              completed.extend(lane_completed)

          canonical_count = summary.get("canonical_node_count")
          if (
              isinstance(canonical_count, bool)
              or not isinstance(canonical_count, int)
              or canonical_count <= 0
              or len(collected) != canonical_count
              or len(completed) != canonical_count
              or Counter(collected) != Counter(completed)
              or len(set(collected)) != canonical_count
          ):
              raise SystemExit("hosted node count mismatch")

          aggregate = summary.get("aggregate_runner_seconds")
          slowest = summary.get("slowest_lane_seconds")
          for value in (aggregate, slowest):
              if (
                  isinstance(value, bool)
                  or not isinstance(value, (int, float))
                  or not math.isfinite(value)
                  or value < 0
              ):
                  raise SystemExit("invalid hosted summary timing")
          if not math.isclose(
              float(aggregate), math.fsum(lane_elapsed), rel_tol=0.0, abs_tol=1e-9
          ):
              raise SystemExit("aggregate runner timing drift")
          if not math.isclose(
              float(slowest), max(lane_elapsed), rel_tol=0.0, abs_tol=1e-9
          ):
              raise SystemExit("slowest lane timing drift")

          start_epoch = int(os.environ["JOB_START_EPOCH"])
          total_wall = time.time() - start_epoch
          if not math.isfinite(total_wall) or total_wall < 0:
              raise SystemExit("invalid Backend hosted wall time")
          totals = coverage.get("totals")
          percent = totals.get("percent_covered") if isinstance(totals, dict) else None
          if (
              isinstance(percent, bool)
              or not isinstance(percent, (int, float))
              or not math.isfinite(percent)
              or percent < 78
              or percent > 100
          ):
              raise SystemExit("invalid hosted global coverage")

          hosted = {
              "aggregate_runner_seconds": float(aggregate),
              "canonical_collected_count": len(collected),
              "completed_count": len(completed),
              "global_coverage_percent": float(percent),
              "global_coverage_sha256": digest(coverage_path),
              "head_sha": expected_head,
              "run_summary_sha256": digest(summary_path),
              "slowest_lane_seconds": float(slowest),
              "timing_target_met": total_wall <= 480,
              "total_backend_wall_seconds": round(total_wall, 3),
          }
          output_path.write_text(
              json.dumps(hosted, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Reassert exact tree custody
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.identity.outputs.tree_sha }}"
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "${{ steps.identity.outputs.tree_sha }}^{tree}")"

      - name: Upload semantic-lane evidence and timing
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-semantic-lane-evidence-${{ steps.identity.outputs.tree_sha }}
          path: backend/.ci/test-lanes/**
          if-no-files-found: warn
          retention-days: 7
