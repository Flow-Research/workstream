name: Agent Gates

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: agent-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent-gates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install deterministic gate dependencies
        run: >-
          python3 -m pip install
          --require-hashes
          --only-binary=:all:
          -r .github/requirements/agent-gates.txt

      - name: Markdown link check
        run: python3 scripts/check_markdown_links.py

      - name: Stale wording check
        run: python3 scripts/check_stale_workstream_wording.py

      - name: Stale authorization documentation check
        run: python3 scripts/check_stale_authorization_docs.py

      - name: Stale artifact contract check
        run: python3 scripts/check_stale_artifact_contracts.py

      - name: Guide extractor dependency validation
        run: python3 backend/scripts/check_guide_extractor_dependencies.py

      - name: Commitrail record validation
        env:
          WORKSTREAM_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python3 scripts/check_commitrail_records.py
          --base-ref "${WORKSTREAM_BASE_SHA}"

      - name: Reviewer contract validation
        run: python3 scripts/reviewer_contracts.py

      - name: Stale review contract validation
        run: python3 scripts/check_stale_review_contracts.py

      - name: Reviewer contract regression tests
        run: >-
          python3 -m unittest -v
          scripts.test_reviewer_contracts
          scripts.test_reviewer_instruction_composition
          scripts.test_review_claim_boundaries
          scripts.test_review_target

      - name: Lightweight gate regression tests
        run: >-
          python3 -m unittest -v
          scripts.test_commitrail_contracts
          scripts.test_commitrail_archive_batch
          scripts.test_lightweight_agent_gates
