name: Agent Gates

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  agent-gates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install agent gate dependencies
        run: python -m pip install --require-hashes -r scripts/agent-gate-requirements.txt

      - name: Fetch signed loop-memory state
        run: >-
          git fetch --no-tags origin
          +refs/heads/automation/loop-memory:refs/remotes/origin/automation/loop-memory

      - name: Machine-checkable chunk scope
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          trusted_scope_dir="$(mktemp -d)"
          trap 'rm -rf "${trusted_scope_dir}"' EXIT
          trusted_checker="${trusted_scope_dir}/check_chunk_contract.py"
          if git cat-file -e "origin/${BASE_REF}:scripts/check_chunk_contract.py"; then
            for script in check_chunk_contract.py update_post_merge_memory.py check_loop_memory_state.py; do
              git show "origin/${BASE_REF}:scripts/${script}" > "${trusted_scope_dir}/${script}"
            done
          else
            if git cat-file -e "origin/${BASE_REF}:.agent-loop/merge-intents/WS-ENG-008-01.json" 2>/dev/null; then
              echo "::error::scope cutover is present; refusing local-script bootstrap" >&2
              exit 1
            fi
            for script in check_chunk_contract.py update_post_merge_memory.py check_loop_memory_state.py; do
              cp "scripts/${script}" "${trusted_scope_dir}/${script}"
            done
          fi
          PYTHONPATH="${trusted_scope_dir}" python3 "${trusted_checker}" \
            --repo "${GITHUB_WORKSPACE}" \
            --base-ref "origin/${BASE_REF}" --head-ref HEAD \
            --state-ref origin/automation/loop-memory

      - name: Static agent sensor advisory
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/workstream_agent_gate.py --base "origin/${BASE_REF}" --head HEAD --format markdown

      - name: Post-merge loop metadata
        env:
          BASE_REF: ${{ github.base_ref }}
        run: >-
          python3 scripts/update_post_merge_memory.py validate-merge-intent
          --base-ref "origin/${BASE_REF}"

      - name: Markdown link check
        run: python3 scripts/check_markdown_links.py

      - name: Stale wording check
        run: python3 scripts/check_stale_workstream_wording.py

      - name: Stale authorization documentation check
        run: python3 scripts/check_stale_authorization_docs.py

      - name: Stale artifact contract check
        run: python3 scripts/check_stale_artifact_contracts.py

      - name: Agent gate regression tests
        run: python scripts/test_agent_gates.py

      - name: Loop-memory updater branch coverage
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python3 -m pytest -p pytest_cov.plugin -q
          --cov=scripts.update_post_merge_memory --cov-branch
          --cov-report=term-missing --cov-fail-under=90
          scripts/test_agent_gates.py scripts/test_update_post_merge_memory.py
          scripts/test_check_loop_memory_state.py

      - name: Loop-memory checker branch coverage
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python3 -m pytest -p pytest_cov.plugin -q
          --cov=scripts.check_loop_memory_state --cov-branch
          --cov-report=term-missing --cov-fail-under=90
          scripts/test_agent_gates.py scripts/test_update_post_merge_memory.py
          scripts/test_check_loop_memory_state.py

      - name: Internal review evidence gate
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          trusted_evidence_dir="$(mktemp -d)"
          trap 'rm -rf "${trusted_evidence_dir}"' EXIT
          if git cat-file -e "origin/${BASE_REF}:scripts/check_chunk_contract.py"; then
            for script in check_internal_review_evidence.py check_chunk_contract.py; do
              git show "origin/${BASE_REF}:scripts/${script}" > "${trusted_evidence_dir}/${script}"
            done
          else
            if git cat-file -e "origin/${BASE_REF}:.agent-loop/merge-intents/WS-ENG-008-01.json" 2>/dev/null; then
              echo "::error::scope cutover is present; refusing local evidence bootstrap" >&2
              exit 1
            fi
            for script in check_internal_review_evidence.py check_chunk_contract.py; do
              cp "scripts/${script}" "${trusted_evidence_dir}/${script}"
            done
          fi
          PYTHONPATH="${trusted_evidence_dir}" python3 \
            "${trusted_evidence_dir}/check_internal_review_evidence.py"
