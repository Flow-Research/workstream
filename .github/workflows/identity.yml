name: Flow Identity provider

on:
  pull_request:
    paths:
      - 'deploy/identity/**'
      - 'packages/external-services/**'
      - 'mcp_server/workstream_mcp/oauth.py'
      - 'mcp_server/workstream_mcp/adapters/keycloak.py'
      - 'scripts/identity_protocol_probe.py'
      - 'scripts/identity_login.py'
      - 'scripts/test_identity_login.py'
      - 'scripts/test_identity_provider.py'
      - 'scripts/test_keycloak_configuration.py'
      - 'scripts/test_identity_bootstrap.py'
      - 'deploy/hosted/bootstrap-identity.py'
      - 'deploy/hosted/initialize-local-data.py'
      - 'scripts/test_hosted_release_config.py'
      - 'scripts/test_hosted_local_data_initialization.py'
      - 'deploy/hosted/compose.identity.yml'
      - 'deploy/hosted/compose.yml'
      - 'deploy/hosted/release.env.example'
      - 'deploy/hosted/preflight.py'
      - 'deploy/hosted/compose.py'
      - 'deploy/hosted/public.Caddyfile'
      - 'scripts/test_public_ingress.py'
      - 'deploy/hosted/workstream-ingress.service'
      - 'backend/app/adapters/auth/flow.py'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - '.dockerignore'
      - '.github/workflows/identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issuer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen verifier dependencies
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'uv==0.10.7'
          uv lock --check
          uv sync --frozen --extra dev
      - name: Build pinned Keycloak identity image
        run: docker build --file deploy/identity/Dockerfile --tag workstream-keycloak:test .
      - name: Verify configuration and deployment boundaries
        run: python3 -m unittest scripts.test_keycloak_configuration scripts.test_identity_bootstrap scripts.test_identity_login scripts.test_hosted_release_config scripts.test_hosted_local_data_initialization.HostedLocalDataInitializationTests -q
      - name: Prove real provider login, exchange, renewal and restart
        env:
          PYTHONPATH: .:backend:mcp_server
        run: backend/.venv/bin/python scripts/test_identity_provider.py -q
      - name: Prove public ingress routing with the pinned Caddy binary
        shell: bash
        run: |
          set -euo pipefail
          proof=$(mktemp -d)
          container=$(docker create caddy@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9)
          trap 'docker rm -f "$container" >/dev/null; rm -rf "$proof"' EXIT
          docker cp "$container:/usr/bin/caddy" "$proof/caddy"
          WORKSTREAM_TEST_CADDY="$proof/caddy" python3 scripts/test_public_ingress.py -q
