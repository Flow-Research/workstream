name: Flow Identity provider

on:
  pull_request:
    paths:
      - 'deploy/identity/**'
      - 'packages/external-services/**'
      - 'mcp_server/workstream_mcp/oauth.py'
      - 'mcp_server/workstream_mcp/adapters/keycloak.py'
      - 'scripts/identity_protocol_probe.py'
      - 'cli/**'
      - 'scripts/test_identity_browser.py'
      - 'scripts/identity_browser_runner.py'
      - 'scripts/test_identity_browser_runner.py'
      - 'scripts/test_identity_provider.py'
      - 'scripts/test_identity_signup.py'
      - 'scripts/identity_mail_fixture.py'
      - '.github/requirements/identity-browser.*'
      - 'scripts/test_keycloak_configuration.py'
      - 'scripts/test_identity_bootstrap.py'
      - 'deploy/hosted/bootstrap-identity.py'
      - 'deploy/hosted/initialize-local-data.py'
      - 'scripts/test_hosted_release_config.py'
      - 'scripts/test_hosted_local_data_initialization.py'
      - 'deploy/hosted/compose.identity.yml'
      - 'deploy/hosted/compose.yml'
      - 'deploy/hosted/release.env.example'
      - 'deploy/hosted/preflight.py'
      - 'deploy/hosted/compose.py'
      - 'deploy/hosted/public.Caddyfile'
      - 'scripts/test_public_ingress.py'
      - 'deploy/hosted/workstream-ingress.service'
      - 'backend/app/adapters/auth/flow.py'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - '.dockerignore'
      - '.github/workflows/identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issuer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen verifier dependencies
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'uv==0.10.7'
          uv lock --check
          uv sync --frozen --extra dev
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Verify native participant login
        working-directory: cli
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go test -mod=readonly ./internal/login ./internal/command
          go build -mod=readonly -o "$RUNNER_TEMP/workstream" ./cmd/workstream
          "$RUNNER_TEMP/workstream" login --help
      - name: Build pinned Keycloak identity image
        run: docker build --file deploy/identity/Dockerfile --tag workstream-keycloak:test .
      - name: Verify configuration and deployment boundaries
        run: backend/.venv/bin/python -m unittest scripts.test_keycloak_configuration scripts.test_identity_browser_runner scripts.test_identity_bootstrap scripts.test_hosted_release_config scripts.test_hosted_local_data_initialization.HostedLocalDataInitializationTests -q
      - name: Prove real provider login, exchange, renewal and restart
        env:
          PYTHONPATH: .:backend:mcp_server
        run: backend/.venv/bin/python scripts/test_identity_provider.py -q
      - name: Install frozen browser qualification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          uv venv "$RUNNER_TEMP/identity-browser" --python 3.12
          uv pip install --python "$RUNNER_TEMP/identity-browser/bin/python" --require-hashes -r .github/requirements/identity-browser.txt
          command -v google-chrome
      - name: Prove verified signup and password recovery through the browser
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/identity-browser/lib/python3.12/site-packages:.:backend:mcp_server"
          backend/.venv/bin/python -m unittest scripts.test_identity_signup.IdentitySignupTests.test_verified_signup_and_password_recovery -q
      - name: Prove public ingress routing with the pinned Caddy binary
        shell: bash
        run: |
          set -euo pipefail
          proof=$(mktemp -d)
          container=$(docker create caddy@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9)
          trap 'docker rm -f "$container" >/dev/null; rm -rf "$proof"' EXIT
          docker cp "$container:/usr/bin/caddy" "$proof/caddy"
          WORKSTREAM_TEST_CADDY="$proof/caddy" python3 scripts/test_public_ingress.py -q
